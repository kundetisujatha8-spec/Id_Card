<!DOCTYPE html>
<html>
<head>
<title>ID Card</title>
<style>

body{
background:#dcdcdc;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.card{
width:260px;
height:420px;
background:black;
border-radius:15px;
text-align:center;
color:white;
padding:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

.logo{
font-size:14px;
font-weight:bold;
margin-bottom:20px;
}

.photo img{
width:120px;
height:120px;
border-radius:10px;
border:3px solid gray;
}

.name{
font-size:20px;
margin-top:15px;
}

.role{
color:lightgray;
margin-bottom:20px;
}

.qr img{
width:80px;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">
AARNA INFRA DEVELOPERS
</div>

<div class="photo">
<img src="photo.jpeg">
</div>

<div class="name">Sujatha Kundeti</div>
<div class="role">Sales Executive</div>

<div class="QR">
<img src="QR.png">
</div>

</div>

</body>
  </html>
